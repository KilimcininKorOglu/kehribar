[package]
name = "git-archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mirrors Git repositories with their full history and serves a read-only web UI"
license = "MIT"
publish = false

[dependencies]
askama = "0.16"
axum = "0.8.9"
axum-extra = { version = "0.12", features = ["cookie"] }
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "1"
url = "2.5"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

# Cyclomatic complexity (limit 10) is enforced by lizard in `make lint`.
# clippy::cognitive_complexity is a different metric that also counts the
# branches inside macro expansions such as tracing::error!.
[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = true
