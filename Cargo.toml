[package]
name = "git-archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Mirrors Git repositories with their full history and serves a read-only web UI"
license = "MIT"
publish = false

[dependencies]
askama = "0.16"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["derive", "macros", "migrate", "runtime-tokio", "sqlite"] }
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "1"
url = "2.5"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
ammonia = "4.2.4"
tokio-util = { version = "0.7.20", features = ["io"] }
base64 = "0.23"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
multer = "3.1"
reqwest = { version = "0.13", features = ["json"] }
rusty-s3 = "0.11"
asciidork-parser = "0.38"
asciidork-dr-html-backend = "0.39"
asciidork-core = "0.37"
rst_parser = "0.4"
rst_renderer = "0.4"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

# Cyclomatic complexity (limit 10) is enforced by lizard in `make lint`.
# clippy::cognitive_complexity is a different metric that also counts the
# branches inside macro expansions such as tracing::error!.
[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = true
