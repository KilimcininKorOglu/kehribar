<nav class="tabs" aria-label="{{ layout.t("browse.tabs") }}">
  <a href="/repos/{{ repo.id }}" aria-current="{% if tab == "overview" %}page{% else %}false{% endif %}">{{ layout.t("browse.overview") }}</a>
  <a href="/repos/{{ repo.id }}/tree" aria-current="{% if tab == "files" %}page{% else %}false{% endif %}">{{ layout.t("browse.files") }}</a>
  <a href="/repos/{{ repo.id }}/commits" aria-current="{% if tab == "commits" %}page{% else %}false{% endif %}">{{ layout.t("browse.commits") }}</a>
  <a href="/repos/{{ repo.id }}/refs" aria-current="{% if tab == "refs" %}page{% else %}false{% endif %}">{{ layout.t("browse.refs") }}</a>
  <a href="/repos/{{ repo.id }}/history" aria-current="{% if tab == "history" %}page{% else %}false{% endif %}">{{ layout.t("history.title") }}</a>
  <a href="/repos/{{ repo.id }}/compare" aria-current="{% if tab == "compare" %}page{% else %}false{% endif %}">{{ layout.t("compare.title") }}</a>
  <a href="/repos/{{ repo.id }}/search" aria-current="{% if tab == "search" %}page{% else %}false{% endif %}">{{ layout.t("search.title") }}</a>
  {% if repo.has_wiki %}<a href="/repos/{{ repo.id }}/wiki" aria-current="{% if tab == "wiki" %}page{% else %}false{% endif %}">{{ layout.t("wiki.title") }}</a>{% endif %}
</nav>
