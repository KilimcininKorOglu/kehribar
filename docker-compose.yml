name: kehribar

services:
  app:
    build: .
    image: kehribar:local
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      KEHRIBAR_ADMIN_USERNAME: ${KEHRIBAR_ADMIN_USERNAME:?set KEHRIBAR_ADMIN_USERNAME}
      KEHRIBAR_ADMIN_PASSWORD: ${KEHRIBAR_ADMIN_PASSWORD:?set KEHRIBAR_ADMIN_PASSWORD}
      KEHRIBAR_SECRET_KEY: ${KEHRIBAR_SECRET_KEY:?set KEHRIBAR_SECRET_KEY}
      KEHRIBAR_LISTEN_ADDR: ${KEHRIBAR_LISTEN_ADDR:-}
      KEHRIBAR_DATA_DIR: ${KEHRIBAR_DATA_DIR:-/data}
      KEHRIBAR_SYNC_INTERVAL_MINUTES: ${KEHRIBAR_SYNC_INTERVAL_MINUTES:-360}
      KEHRIBAR_SYNC_CONCURRENCY: ${KEHRIBAR_SYNC_CONCURRENCY:-2}
      KEHRIBAR_GIT_TIMEOUT_SECONDS: ${KEHRIBAR_GIT_TIMEOUT_SECONDS:-3600}
      KEHRIBAR_SESSION_TTL_HOURS: ${KEHRIBAR_SESSION_TTL_HOURS:-168}
      KEHRIBAR_COOKIE_SECURE: ${KEHRIBAR_COOKIE_SECURE:-false}
      KEHRIBAR_LOG_LEVEL: ${KEHRIBAR_LOG_LEVEL:-info}
      KEHRIBAR_TRUSTED_PROXIES: ${KEHRIBAR_TRUSTED_PROXIES:-}
      KEHRIBAR_FSCK_INTERVAL_DAYS: ${KEHRIBAR_FSCK_INTERVAL_DAYS:-7}
      KEHRIBAR_REPACK_INTERVAL_DAYS: ${KEHRIBAR_REPACK_INTERVAL_DAYS:-7}
      KEHRIBAR_PUBLIC_URL: ${KEHRIBAR_PUBLIC_URL:-}
      KEHRIBAR_NOTIFY_WEBHOOK_URL: ${KEHRIBAR_NOTIFY_WEBHOOK_URL:-}
      KEHRIBAR_NOTIFY_TELEGRAM_BOT_TOKEN: ${KEHRIBAR_NOTIFY_TELEGRAM_BOT_TOKEN:-}
      KEHRIBAR_NOTIFY_TELEGRAM_CHAT_ID: ${KEHRIBAR_NOTIFY_TELEGRAM_CHAT_ID:-}
      KEHRIBAR_NOTIFY_TELEGRAM_API_URL: ${KEHRIBAR_NOTIFY_TELEGRAM_API_URL:-https://api.telegram.org}
      KEHRIBAR_NOTIFY_LANG: ${KEHRIBAR_NOTIFY_LANG:-tr}
      KEHRIBAR_BACKUP_S3_ENDPOINT: ${KEHRIBAR_BACKUP_S3_ENDPOINT:-}
      KEHRIBAR_BACKUP_S3_REGION: ${KEHRIBAR_BACKUP_S3_REGION:-us-east-1}
      KEHRIBAR_BACKUP_S3_BUCKET: ${KEHRIBAR_BACKUP_S3_BUCKET:-}
      KEHRIBAR_BACKUP_S3_PREFIX: ${KEHRIBAR_BACKUP_S3_PREFIX:-}
      KEHRIBAR_BACKUP_S3_ACCESS_KEY_ID: ${KEHRIBAR_BACKUP_S3_ACCESS_KEY_ID:-}
      KEHRIBAR_BACKUP_S3_SECRET_ACCESS_KEY: ${KEHRIBAR_BACKUP_S3_SECRET_ACCESS_KEY:-}
      KEHRIBAR_BACKUP_S3_PATH_STYLE: ${KEHRIBAR_BACKUP_S3_PATH_STYLE:-false}
      KEHRIBAR_BACKUP_INTERVAL_HOURS: ${KEHRIBAR_BACKUP_INTERVAL_HOURS:-24}
      KEHRIBAR_BACKUP_KEEP: ${KEHRIBAR_BACKUP_KEEP:-7}
    volumes:
      - kehribar-data:/data

volumes:
  kehribar-data:
