name: kehribar

services:
  app:
    build: .
    image: kehribar:local
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      KEHRIBAR_ADMIN_USERNAME: ${KEHRIBAR_ADMIN_USERNAME:?set KEHRIBAR_ADMIN_USERNAME}
      KEHRIBAR_ADMIN_PASSWORD: ${KEHRIBAR_ADMIN_PASSWORD:?set KEHRIBAR_ADMIN_PASSWORD}
      KEHRIBAR_SECRET_KEY: ${KEHRIBAR_SECRET_KEY:?set KEHRIBAR_SECRET_KEY}
      KEHRIBAR_LISTEN_ADDR: ${KEHRIBAR_LISTEN_ADDR:-}
      KEHRIBAR_DATA_DIR: ${KEHRIBAR_DATA_DIR:-/data}
      KEHRIBAR_SYNC_INTERVAL_MINUTES: ${KEHRIBAR_SYNC_INTERVAL_MINUTES:-360}
      KEHRIBAR_SYNC_CONCURRENCY: ${KEHRIBAR_SYNC_CONCURRENCY:-2}
      KEHRIBAR_GIT_TIMEOUT_SECONDS: ${KEHRIBAR_GIT_TIMEOUT_SECONDS:-3600}
      KEHRIBAR_SESSION_TTL_HOURS: ${KEHRIBAR_SESSION_TTL_HOURS:-168}
      KEHRIBAR_COOKIE_SECURE: ${KEHRIBAR_COOKIE_SECURE:-false}
      KEHRIBAR_LOG_LEVEL: ${KEHRIBAR_LOG_LEVEL:-info}
      KEHRIBAR_TRUSTED_PROXIES: ${KEHRIBAR_TRUSTED_PROXIES:-}
    volumes:
      - kehribar-data:/data

volumes:
  kehribar-data:
