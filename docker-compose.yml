name: git-archive

services:
  app:
    build: .
    image: git-archive:local
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      GIT_ARCHIVE_ADMIN_USERNAME: ${GIT_ARCHIVE_ADMIN_USERNAME:?set GIT_ARCHIVE_ADMIN_USERNAME}
      GIT_ARCHIVE_ADMIN_PASSWORD: ${GIT_ARCHIVE_ADMIN_PASSWORD:?set GIT_ARCHIVE_ADMIN_PASSWORD}
      GIT_ARCHIVE_SECRET_KEY: ${GIT_ARCHIVE_SECRET_KEY:?set GIT_ARCHIVE_SECRET_KEY}
      GIT_ARCHIVE_LISTEN_ADDR: ${GIT_ARCHIVE_LISTEN_ADDR:-}
      GIT_ARCHIVE_DATA_DIR: ${GIT_ARCHIVE_DATA_DIR:-/data}
      GIT_ARCHIVE_SYNC_INTERVAL_MINUTES: ${GIT_ARCHIVE_SYNC_INTERVAL_MINUTES:-360}
      GIT_ARCHIVE_SYNC_CONCURRENCY: ${GIT_ARCHIVE_SYNC_CONCURRENCY:-2}
      GIT_ARCHIVE_GIT_TIMEOUT_SECONDS: ${GIT_ARCHIVE_GIT_TIMEOUT_SECONDS:-3600}
      GIT_ARCHIVE_SESSION_TTL_HOURS: ${GIT_ARCHIVE_SESSION_TTL_HOURS:-168}
      GIT_ARCHIVE_COOKIE_SECURE: ${GIT_ARCHIVE_COOKIE_SECURE:-false}
      GIT_ARCHIVE_LOG_LEVEL: ${GIT_ARCHIVE_LOG_LEVEL:-info}
      GIT_ARCHIVE_TRUSTED_PROXIES: ${GIT_ARCHIVE_TRUSTED_PROXIES:-}
    volumes:
      - git-archive-data:/data

volumes:
  git-archive-data:
